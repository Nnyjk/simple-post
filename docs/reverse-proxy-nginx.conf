# docs/reverse-proxy-nginx.conf
#
# Reference nginx configuration for putting the simple-post serve-web
# shape behind a path prefix (`/sp` here). The binary MUST be started
# with `--public-base-path /sp` (or `SIMPLE_POST_PUBLIC_BASE_PATH=/sp`)
# for this to work — otherwise the binary serves at `/` and nginx's
# `/sp` prefix routes 404.
#
# Drop this into a `server {}` block, or include from one:
#
#     include /etc/nginx/snippets/simple-post.conf;
#
# Tested with nginx 1.24. The TLS termination is intentionally out of
# scope (commit 6 said "delegated to upstream reverse proxy") — wrap
# the server block with your TLS settings if you need HTTPS.

upstream simple_post_backend {
    # 127.0.0.1 if the binary runs on the same host; private LAN IP
    # otherwise. The binary's `--bind` MUST be 0.0.0.0 in that case.
    server 127.0.0.1:4173;
    keepalive 32;
}

# Map lets `/sp` (no trailing slash) redirect to `/sp/`, but only
# once. Without it, `/sp/api/projects` and `/spapi/projects` collide.
map $request_uri $simple_post_redirect_to_slash {
    # request_uri starts with a `/`, so the prefix we care about is
    # `/sp` (not `/sp/`).  Only redirect exact `/sp` with no further
    # path.
    ~^/sp$   /sp/;
    default  "";
}

server {
    listen 80;
    server_name simple-post.lan;   # change to your hostname

    # -----------------------------------------------------------------
    # Health probes: hit them directly at the bare path so Docker /
    # k8s liveness probes can keep working even when the prefix is
    # in use.  These are public per auth.rs::is_public_path.
    # -----------------------------------------------------------------
    location = /healthz        { proxy_pass http://simple_post_backend; }
    location = /api/healthz    { proxy_pass http://simple_post_backend; }
    location = /mcp/healthz    { proxy_pass http://simple_post_backend; }

    # -----------------------------------------------------------------
    # Optional: redirect /sp → /sp/ (clean trailing-slash UX).
    # -----------------------------------------------------------------
    location = /sp {
        return 301 /sp/;
    }

    # -----------------------------------------------------------------
    # Everything else under /sp/ goes to the backend.
    # -----------------------------------------------------------------
    location /sp/ {
        # Strip the /sp prefix so the binary sees /api/projects etc.
        # The binary then nests its own router under /sp, which means
        # the upstream request actually looks like:
        #
        #     GET /api/projects HTTP/1.1     (after rewrite)
        #
        # The `proxy_set_header Host $host;` line is what makes the
        # backend think the user navigated to https://localhost/sp/api,
        # so `Referer` / `Origin` checks (browser-side) still pass.
        proxy_pass http://simple_post_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade headers (no-op for HTTP, harmless).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Don't buffer streaming responses (SSE in v0.3+).
        proxy_buffering off;

        # Long timeout for SSE.
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
    }

    # Everything outside /sp, /healthz, /api/healthz, /mcp/healthz → 404.
    location / {
        return 404;
    }
}

# Required for the WebSocket upgrade map above. Place this OUTSIDE the
# server block (it's a top-level block). Keeping it here so the snippet
# is self-contained.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}