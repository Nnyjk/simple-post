[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/simple-post-core",
    "crates/simple-post-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"

[workspace.dependencies]
# Shared serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async / IO / CLI
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "io-util",
    "sync",
    "time",
    "net",
    "signal",
] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "gzip",
    "brotli",
    "deflate",
    "http2",
] }
clap = { version = "4", features = ["derive"] }

# SQLite (bundled, native-tls free)
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"

# Errors + logging
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# JSON path (variable interpolation)
serde_json_path = "0.1"

# Cross-platform paths
dirs = "5"

# HTTP server (serve-web)
axum = "0.7"
tower-http = { version = "0.5", features = ["fs", "trace"] }
mime_guess = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true