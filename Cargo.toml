[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/simple-post-core",
    "crates/simple-post-interchange",
    "crates/simple-post-mcp",
    "crates/simple-post-server",
]

[workspace.package]
version = "0.1.45"
edition = "2021"
# 1.87：请求脚本的沙箱引擎 rquickjs 要求它。选它是因为只有它同时给出
# 「真墙钟打断 + 内存上限 + 栈上限」，而本项目 Windows 端已因 Tauri 需要 MSVC、
# Docker 构建阶段已带 gcc，故不新增任何工具链要求。
rust-version = "1.87"
license = "MIT"

[workspace.dependencies]
# Shared serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async / IO / CLI
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "io-util",
    "fs",
    "sync",
    "time",
    "net",
    "signal",
] }
# Pinned to 0.12 on purpose — do not "unify" this to 0.13 to match Tauri.
#
# `Cargo.lock` lists reqwest 0.13.5 and **it does get compiled on desktop**: the
# dependency comes from `tauri-plugin-updater 2.14.1`, whose `[dependencies.reqwest]`
# is unconditional (not optional, not target-gated) — verified in the crate's own
# manifest, not inferred from the lock alone. Tauri 2.12.5 (the version actually in
# `Cargo.lock`) declares reqwest only for android / non-macOS Apple targets, so that
# one really is absent on Windows; the plugin is the one that puts 0.13 in the build.
# So the desktop binary does carry two HTTP/TLS stacks after all — the cost is real,
# it is just cheaper than giving up the bundled roots below.
#
# The blocker is TLS: reqwest 0.13 removed every webpki-roots feature, so
# `rustls` and `rustls-no-provider` both force `rustls-platform-verifier`
# (the OS cert store) as the only root source. As an API client that hits
# arbitrary HTTPS endpoints, we want the deterministic, bundled Mozilla root
# set that 0.12's `rustls-tls` provides. 0.13 also needs rust-version >= 1.85.
# `http2` is a deliberate capability bit, not an accident: reqwest 0.12 gates
# `h2` + `hyper/http2` behind it (see `reqwest/src/async_impl/client.rs`, the
# `#[cfg(feature = "http2")]` blocks around the builder's http2 knobs). Under
# `default-features = false` HTTP/2 is otherwise off, so dropping this line would
# silently downgrade every HTTP/2-only endpoint we talk to. Keep it.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "gzip",
    "brotli",
    "deflate",
    "http2",
    "json",
    # SSE：`Response::chunk()` 只在开这个 feature 时存在（`reqwest` 的流式响应体）。
    # 关掉它，`/api/http/stream` 就只能拿整块 body，流也就没有意义。
    "stream",
] }
clap = { version = "4", features = ["derive", "env"] }

# SQLite (bundled, native-tls free)
# Stays on 0.31 because `r2d2_sqlite 0.24` (next line) pins `rusqlite ^0.31`; the
# two move together, and upgrading rusqlite means bumping r2d2_sqlite to the
# matching release plus a `libsqlite3-sys` change — a separate, testable change,
# not a drive-by edit. `bundled` is required: Docker and Windows must not depend
# on a system libsqlite3.
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"

# Errors + logging
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# JSON path (variable interpolation)
serde_json_path = "0.7"

# 请求脚本的沙箱引擎（QuickJS-NG）。选它是因为只有它同时给出「真墙钟打断
# （set_interrupt_handler）+ 内存上限（set_memory_limit）+ 栈上限（set_max_stack_size）」，
# 而 issue 要求「超时要能中断执行而不是等它自己跑完」。
#
# **不要开 `rust-alloc` / `allocator`**：`set_memory_limit` 在使用自定义分配器时是
# no-op，内存上限会静默失效，而那正是本项目对沙箱的硬承诺。
rquickjs = { version = "0.14", default-features = false, features = ["std"] }

# 配置哈希（oauth2 token 缓存的主键）。用 0.10，不是因为「树里已经有」这句话本身，
# 而是因为那份已经在树里的是 **0.10.9**：`oauth2 5.0.0`（本 crate 的直接依赖）与
# `tauri-codegen` / `wry` 都用 0.10，故 `sha2 = "0.10"` 与它们共用同一个编译单元。
# 反过来写 `"0.11"` 会新增一个 semver 主版本，`Cargo.lock` 里就会同时出现 0.10.9 与
# 0.11.x 两条 —— 那才是「多拉一个新 crate」。API 面在 `Digest` / `Sha256` 上两边一致，
# 唯一使用点是 `crates/simple-post-core/src/oauth2/store.rs`。
sha2 = "0.10"

# base64（`Authorization: Basic` 用）。已由 `reqwest` / `hyper-util` 传递依赖进来
# 并参与编译，所以显式加依赖的边际成本是零 —— 不再手写两份编码器。
#
# 这条「边际成本为零」**只在桌面构建成立**：传递那一份是 0.22.1，而这里要的 0.23.1
# 只因为 `plist` / `serde_with` / `tauri-codegen` / `tauri-plugin-updater` / `reqwest 0.13`
# 才在同一棵树里。容器/headless 构建（`simple-post-server`）不编译那些，于是 0.23 是
# 纯新增的一份（`Cargo.lock` 里 0.21.7 / 0.22.1 / 0.23.1 三条并存）。若哪天要收这一份，
# 改 `"0.22"` 即可与 `reqwest 0.12` / `hyper-util` / `oauth2` 对齐。
base64 = "0.23"

# OAuth2 的 grant / refresh 请求构造（`grant_type`、client 凭据放置、PKCE、
# `extra_params`、form 编码）。自研这套时 crate 还没进依赖树，所以那笔账不成立；
# `cargo add` 实测新增 5 个 `[[package]]`（本 crate + `rand`/`rand_chacha`/
# `rand_core`/`ppv-lite86`），已在 506 个包的树里占约 1%，换来的是协议细节由上游维护。
#
# `default-features = false`：**不要**开 `reqwest`。token 端点必须走
# `http_executor`，否则 `SIMPLE_POST_BLOCK_PRIVATE_NET` 的 SSRF 防护、超时、
# 重定向限制与体积上限会被绕过，成为第二条出站通道。出站由
# `oauth2::AsyncHttpClient` 适配，见 `crates/simple-post-core/src/oauth2/http_client.rs`。
oauth2 = { version = "5.0.0", default-features = false }

# SSE 的 axum 响应要求 `Stream`，而 tokio 的 mpsc 接收端不是；`stream::unfold` 与
# WebSocket 的 `SinkExt`/`StreamExt` 都出自这里。它已在 reqwest/hyper-util 的树里，
# 显式声明只是为了能直接 `use`。
futures-util = "0.3"

# WebSocket 会话（issue #12）。`connect` 提供 `connect_async`，`rustls-tls-webpki-roots`
# 让 WSS 的根证书与 HTTP 侧同一套（内置 Mozilla 根），不引 OS 证书库那条路。
tokio-tungstenite = { version = "0.26", default-features = false, features = [
    "connect",
    "handshake",
    "rustls-tls-webpki-roots",
] }
# WSS 的 `acceptInvalidCerts` 要自己造校验器，而 tokio-tungstenite 不重导出 rustls。
# 版本与 reqwest 的 `rustls-tls` 拉进来的同一份（0.23）；关掉 default 的 aws-lc-rs，
# 用树里已有的 ring，不新增任何编译单元。
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
# WSS 的根证书底座：版本与 tokio-tungstenite 的 `rustls-tls-webpki-roots` 拉进来的
# 那份相同（0.26），只是要显式读那份 trust anchor 列表。
webpki-roots = "0.26"
# WSS 的客户端证书/CA 要从 PEM 读成 rustls 的类型。reqwest 的 rustls 后端不重导出
# 解析器，故显式声明；版本取当前主版本 2，不引入第二个主版本。
rustls-pemfile = "2"

# Cross-platform paths
dirs = "7"

# HTTP server (serve-web)
axum = { version = "0.8", features = ["multipart"] }
# 0.6, not 0.7: `reqwest` 0.12 already compiles `tower-http 0.6.11` for its own
# middleware, so staying on 0.6 shares that build instead of adding a second copy.
# The only API we touch is `tower_http::services::ServeDir` (same path in both
# lines — `tower-http-0.6.11/src/services/mod.rs`), so nothing else moves.
# `trace` was never enabled by any code: no `TraceLayer` anywhere, only `ServeDir`.
tower-http = { version = "0.6", features = ["fs"] }
mime_guess = "2"

# Dev profile: keep `target/debug` from ballooning to tens of GB.
# Debug info is the dominant cost here (rlib / pdb / rmeta all carry it), and
# stepping into a third-party crate is not a workflow we rely on.
[profile.dev]
# Own crates keep line numbers, so panics and backtraces stay line-accurate.
debug = "line-tables-only"

[profile.dev.package."*"]
# All 288 transitive dependencies ship without debug info entirely.
debug = false

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true