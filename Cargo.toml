[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/simple-post-core",
    "crates/simple-post-mcp",
    "crates/simple-post-server",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"

[workspace.dependencies]
# Shared serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async / IO / CLI
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "io-util",
    "sync",
    "time",
    "net",
    "signal",
] }
# Pinned to 0.12 on purpose — do not "unify" this to 0.13 to match Tauri.
#
# `Cargo.lock` does list reqwest 0.13.5, but Tauri 2.11.6 declares reqwest only
# under a mobile-target cfg, so 0.13 is never compiled on Windows and costs
# nothing. The two are not actually building duplicate HTTP stacks here.
#
# The blocker is TLS: reqwest 0.13 removed every webpki-roots feature, so
# `rustls` and `rustls-no-provider` both force `rustls-platform-verifier`
# (the OS cert store) as the only root source. As an API client that hits
# arbitrary HTTPS endpoints, we want the deterministic, bundled Mozilla root
# set that 0.12's `rustls-tls` provides. 0.13 also needs rust-version >= 1.85.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "gzip",
    "brotli",
    "deflate",
    "http2",
  "json",
] }
clap = { version = "4", features = ["derive", "env"] }

# SQLite (bundled, native-tls free)
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"

# Errors + logging
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# JSON path (variable interpolation)
serde_json_path = "0.7"

# Cross-platform paths
dirs = "7"

# HTTP server (serve-web)
axum = "0.7"
tower-http = { version = "0.5", features = ["fs", "trace"] }
mime_guess = "2"

# Dev profile: keep `target/debug` from ballooning to tens of GB.
# Debug info is the dominant cost here (rlib / pdb / rmeta all carry it), and
# stepping into a third-party crate is not a workflow we rely on.
[profile.dev]
# Own crates keep line numbers, so panics and backtraces stay line-accurate.
debug = "line-tables-only"

[profile.dev.package."*"]
# All 288 transitive dependencies ship without debug info entirely.
debug = false

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true