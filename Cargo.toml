[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/simple-post-core",
    "crates/simple-post-interchange",
    "crates/simple-post-mcp",
    "crates/simple-post-server",
]

[workspace.package]
version = "0.1.2"
edition = "2021"
# 1.87：请求脚本的沙箱引擎 rquickjs 要求它。选它是因为只有它同时给出
# 「真墙钟打断 + 内存上限 + 栈上限」，而本项目 Windows 端已因 Tauri 需要 MSVC、
# Docker 构建阶段已带 gcc，故不新增任何工具链要求。
rust-version = "1.87"
license = "MIT"

[workspace.dependencies]
# Shared serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async / IO / CLI
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "io-util",
    "sync",
    "time",
    "net",
    "signal",
] }
# Pinned to 0.12 on purpose — do not "unify" this to 0.13 to match Tauri.
#
# `Cargo.lock` does list reqwest 0.13.5, but Tauri 2.11.6 declares reqwest only
# under a mobile-target cfg, so 0.13 is never compiled on Windows and costs
# nothing. The two are not actually building duplicate HTTP stacks here.
#
# The blocker is TLS: reqwest 0.13 removed every webpki-roots feature, so
# `rustls` and `rustls-no-provider` both force `rustls-platform-verifier`
# (the OS cert store) as the only root source. As an API client that hits
# arbitrary HTTPS endpoints, we want the deterministic, bundled Mozilla root
# set that 0.12's `rustls-tls` provides. 0.13 also needs rust-version >= 1.85.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "gzip",
    "brotli",
    "deflate",
    "http2",
  "json",
] }
clap = { version = "4", features = ["derive", "env"] }

# SQLite (bundled, native-tls free)
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"

# Errors + logging
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# JSON path (variable interpolation)
serde_json_path = "0.7"

# 请求脚本的沙箱引擎（QuickJS-NG）。选它是因为只有它同时给出「真墙钟打断
# （set_interrupt_handler）+ 内存上限（set_memory_limit）+ 栈上限（set_max_stack_size）」，
# 而 issue 要求「超时要能中断执行而不是等它自己跑完」。
#
# **不要开 `rust-alloc` / `allocator`**：`set_memory_limit` 在使用自定义分配器时是
# no-op，内存上限会静默失效，而那正是本项目对沙箱的硬承诺。
rquickjs = { version = "0.12", default-features = false, features = ["std"] }

# 配置哈希（oauth2 token 缓存的主键）。已经因 Tauri 侧 `soup3` 的传递依赖进了
# Cargo.lock 并在 Windows 上参与编译，故这里不会多拉一个新 crate。
sha2 = "0.10"

# base64（`Authorization: Basic` 用）。已由 `reqwest` / `hyper-util` 传递依赖进来
# 并参与编译，所以显式加依赖的边际成本是零 —— 不再手写两份编码器。
base64 = "0.23"

# OAuth2 的 grant / refresh 请求构造（`grant_type`、client 凭据放置、PKCE、
# `extra_params`、form 编码）。自研这套时 crate 还没进依赖树，所以那笔账不成立；
# `cargo add` 实测新增 5 个 `[[package]]`（本 crate + `rand`/`rand_chacha`/
# `rand_core`/`ppv-lite86`），已在 506 个包的树里占约 1%，换来的是协议细节由上游维护。
#
# `default-features = false`：**不要**开 `reqwest`。token 端点必须走
# `http_executor`，否则 `SIMPLE_POST_BLOCK_PRIVATE_NET` 的 SSRF 防护、超时、
# 重定向限制与体积上限会被绕过，成为第二条出站通道。出站由
# `oauth2::AsyncHttpClient` 适配，见 `crates/simple-post-core/src/oauth2/http_client.rs`。
oauth2 = { version = "5.0.0", default-features = false }

# Cross-platform paths
dirs = "7"

# HTTP server (serve-web)
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "trace"] }
mime_guess = "2"

# Dev profile: keep `target/debug` from ballooning to tens of GB.
# Debug info is the dominant cost here (rlib / pdb / rmeta all carry it), and
# stepping into a third-party crate is not a workflow we rely on.
[profile.dev]
# Own crates keep line numbers, so panics and backtraces stay line-accurate.
debug = "line-tables-only"

[profile.dev.package."*"]
# All 288 transitive dependencies ship without debug info entirely.
debug = false

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true