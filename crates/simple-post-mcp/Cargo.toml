[package]
name = "simple-post-mcp"
description = "MCP server module (axum-based JSON-RPC tool dispatcher) + standalone CLI binary for Simple Post"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# 只在本仓库内用路径依赖，不发布到 crates.io（误 publish 会抢注这个名字）。
publish = false

[lib]
name = "simple_post_mcp"
path = "src/lib.rs"

[[bin]]
name = "simple-post-mcp"
path = "src/main.rs"

[dependencies]
simple-post-core = { path = "../simple-post-core" }

serde = { workspace = true }
serde_json = { workspace = true }
serde_json_path = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true }
reqwest = { workspace = true }
# `r2d2` / `r2d2_sqlite` are only touched by `#[cfg(test)]` code: the in-memory pool
# in `src/daemon_http_test.rs`. Production paths take the pool type from
# `simple_post_core::db::DbPool` (`src/mcp/state.rs`), so every host linking this
# library must not inherit them. Declared under `[dev-dependencies]` below.
base64 = { workspace = true }
# `daemon_http` runs the axum MCP router that the Tauri shell and `serve-web`
# both consume. Lives here (not in core) because the router directly uses
# `mcp::dispatch` / `mcp::AppState`.
axum = { workspace = true }

[dev-dependencies]
# Test-only, see the note above `base64` in `[dependencies]`.
r2d2 = { workspace = true }
r2d2_sqlite = { workspace = true }
