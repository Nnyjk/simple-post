name: Release Tauri App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build & release (leave empty to use ref name)'
        required: false
        default: ''

# One release per tag. `cancel-in-progress: false` is deliberate: the point
# is to stop two runs racing for the same release, and cancelling a publish
# halfway would leave a partial one, which is worse than the duplicate it
# prevents. A second trigger queues behind the first instead of running
# beside it.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin --bundles app,dmg'
          - platform: ubuntu-22.04
            args: '--bundles deb,appimage'
          - platform: windows-latest
            args: '' # tauri.conf.json targets=["nsis"] 已经够
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Same major as ci.yml. This used to pin 20 while CI ran 22, so a
          # release built against a Node the gate never tested — and 22 is
          # what `engines` plus ESLint 10 actually want.
          node-version: 22
          cache: 'npm'

      # GitHub Actions 默认会设 NODE_ENV=production,导致 `npm ci` 跳过
      # devDependencies,而 @tauri-apps/cli 在 devDependencies 里 —— 没有它,
      # `npm run tauri build` 会 "tauri: command not found"。 显式装 devDeps。
      - name: Install dependencies (with devDependencies for tauri CLI)
        run: npm ci --include=dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.platform }}

      - name: Install Linux deps (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # 更新包要签名。缺 `TAURI_SIGNING_PRIVATE_KEY` 时 `createUpdaterArtifacts: true`
      # 会让 `tauri build` 在打包末尾签名失败，整个发布变红；故缺密钥时把更新产物与
      # updater 配置一起摘掉，本次只出货安装包。私钥只进探测这一步的环境，不铺到整个 job。
      - name: Probe updater signing key
        id: updater-signing
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Disable updater artifacts (no signing key)
        if: steps.updater-signing.outputs.present == 'false'
        shell: bash
        run: |
          node -e '
          const fs = require("node:fs");
          const path = "src-tauri/tauri.conf.json";
          const conf = JSON.parse(fs.readFileSync(path, "utf8"));
          conf.bundle.createUpdaterArtifacts = false;
          if (conf.plugins) delete conf.plugins.updater;
          fs.writeFileSync(path, JSON.stringify(conf, null, 2) + "\n");
          '
          echo "::warning::TAURI_SIGNING_PRIVATE_KEY 未配置：本次发布不产出更新包与 latest.json，应用内自动更新保持不可用。"

      - name: Build & publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 有这两份 secret 时 tauri-action 会签名更新包（`*.sig`）、上传签名，并把
          # `latest.json` 覆盖写进同一个 release；缺 `*.sig` 时它只打印
          # "Signature not found for the updater JSON. Skipping upload..." 后继续。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.tag || format('refs/tags/{0}', github.ref_name) }}
          releaseName: 'Simple Post v__VERSION__'
          releaseBody: |
            ### 这一版的改动
            <!-- 发布前替换本节：应用内「更新」对话框显示的就是这段正文 -->

            ## Simple Post v__VERSION__

            Desktop API client with built-in MCP for AI collaboration.

            ### Install
            - **macOS**: open the `.dmg`, drag `simple-post.app` to Applications
            - **Ubuntu**: `sudo dpkg -i simple-post_*_amd64.deb` or `chmod +x simple-post_*_amd64.AppImage && ./simple-post_*_amd64.AppImage`
            - **Windows**: run the `simple-post_*_x64-setup.exe` NSIS installer

            ### Container image
            A matching `linux/amd64` image is published
            to GitHub Container Registry by `.github/workflows/publish-image.yml`
            on the same tag:

            ```
            # GHCR stores the image under the lowercase path, and docker
            # refuses a reference whose path contains uppercase letters
            # (`invalid reference format: repository name must be
            # lowercase`). `github.repository` keeps the owner's original
            # case, so the pull command spells the published path out.
            docker pull ghcr.io/nnyjk/simple-post:${{ github.ref_name }}
            ```

            The same image is also tagged without the `v` (`__VERSION__`), plus
            `:0.1` (rolling minor) and `:latest` (rolling latest).
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # latest.json 是应用内更新的入口，它每个平台的 url 必须是 release 的下载地址
  # （`https://github.com/<owner>/<repo>/releases/download/<tag>/<asset>`）。
  # 上面三个矩阵作业用 `releaseDraft: true`，tauri-action 会把资产表里的 API 端点
  # （`https://api.github.com/repos/<owner>/<repo>/releases/assets/<id>`）写进这个 url，
  # 而那个端点是 API 端点，不是下载端点：它要求请求带 `User-Agent`，
  # 不带时返回 `403 Forbidden`（`Request forbidden by administrative rules`），
  # 而 tauri-plugin-updater 用的 reqwest 默认不发 `User-Agent`，
  # 下载因此拿到 `403` —— 0.1.35 → 0.1.36 的应用内更新正是这样失败的。
  # 同一个端点带上 `Accept: application/octet-stream` 才 `302` 去文件，不带只返回元数据 JSON。
  # 故公布 release 之后再跑一遍改写脚本；删掉这个作业，每一次发布出去的最新包都装不上。
  # 没有 `TAURI_SIGNING_PRIVATE_KEY` 时这次发布不产 latest.json，
  # 脚本查到资产表里没有该文件就直接跳过（退出码 0），作业保持绿。
  fix-updater-json:
    needs: release
    if: needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Rewrite latest.json platform urls
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 手动触发时 tag 可能带 refs/tags/ 前缀，脚本自己去掉。
          TAG: ${{ inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: node scripts/rewrite-updater-json.mjs --tag "$TAG" --repo "$REPO"
