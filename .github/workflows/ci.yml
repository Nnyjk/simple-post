name: CI

# Quality gate — every push to main and every PR must clear the same
# checks `npm run check` runs locally, plus a production build and a
# running-container smoke test. The release workflow stays independent
# of this one.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly arm64 compile check. It is deliberately not a required
    # check, so a scheduled run is its one chance to catch a
    # target-specific break before the next release.
    - cron: '23 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    # Actions has no per-job path filter: `paths` is workflow-level, and
    # a workflow-level filter would take `web` and `rust` down with it —
    # those two are the required checks set in #25, so skipping them would
    # report "nothing ran" instead of "passed". Compute the scope here and
    # let `docker` read it through `needs` instead.
    #
    # A skipped job is reported as successful, which is what a skipped
    # required check needs, so `docker` going idle on a docs-only PR is
    # safe. `!cancelled()` in its `if` is the fail-closed half: if this
    # job errors, `docker` runs anyway rather than silently reporting green.
    name: Change scope
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      # On `pull_request` this reads the file list from the API; on
      # `push`/`schedule` it diffs, which needs more than the shallow
      # default. Repo is small, so a full fetch costs little.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            docker:
              - 'Dockerfile'
              - '.dockerignore'
              - 'docker-compose.yml'
              - 'docker-swarm.yml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'package.json'
              - 'package-lock.json'
              - 'crates/**'
              - 'src-tauri/**'
              - 'src/**'
              - 'scripts/**'
              - 'index.html'
              - 'vite.config.ts'
              - 'public/**'
              - '.github/workflows/ci.yml'

  web:
    name: Web — format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 'Setup Node (engines: >=20 <23; ESLint 10 wants >=22.13)'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Actions defaults NODE_ENV=production, which would skip
      # devDependencies — @tauri-apps/cli, eslint, prettier, tsx all
      # live there. Mirror release.yml.
      - name: Install dependencies (with devDependencies)
        run: npm ci --include=dev

      - name: Prettier (format check)
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: TypeScript (tsc -b)
        run: npm run typecheck

      - name: Unit tests (auto-discovered *.test.ts)
        run: npm test

      - name: Production build (vite)
        run: npm run build

  rust:
    # Windows-first project: windows-latest avoids installing the
    # webkit2gtk/GTK toolchain that the src-tauri member needs on
    # Linux, and matches the dev environment the fmt/clippy output
    # was normalized in.
    name: Rust — fmt, clippy, test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies and build output
        uses: swatinem/rust-cache@v2
        with:
          # Registry deps alone are the coarse half: `fmt`, `clippy` and
          # `test` are three separate cargo invocations that would each
          # cold-compile the same target/ from nothing.
          cache-target: true

      - name: cargo fmt (check only)
        run: cargo fmt --all --check

      - name: cargo clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test --workspace
        run: cargo test --workspace

  docker:
    # Container image + a smoke test against a *running* container.
    # Gated on change scope: measured on main at 18m14s, this job was
    # 98.7% of a full CI run's wall clock, and a README-only PR does not
    # change a single byte of it. Every assertion below is untouched —
    # each is the regression net for a defect that shipped (#17 / #19 /
    # #20), and none of them is traded for speed.
    name: Docker — image build + container smoke test
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docker != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: 'Set up Buildx'
        uses: docker/setup-buildx-action@v4

      - name: 'Build image (linux/amd64, loaded into the runner daemon)'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          # Same tag the two compose files reference, so this job exercises
          # the exact image name the deployment docs tell users to build.
          tags: simple-post:local
          load: true

      - name: 'Start container and wait for the image HEALTHCHECK'
        run: |
          set -euo pipefail

          VOL=sp-smoke-data
          # Start from an empty volume so a re-run can never pass on state
          # left over by a previous one.
          docker volume rm -f "$VOL" >/dev/null 2>&1 || true
          docker volume create "$VOL" >/dev/null

          docker run -d --name sp-smoke \
            -p 4173:4173 \
            -e SIMPLE_POST_WEB_PASSWORD=ci-secret-token \
            -v "$VOL":/data \
            simple-post:local

          # Wait on the image's own HEALTHCHECK rather than on a sleep: it is
          # the same probe Swarm/Compose will use, so this step also covers
          # the probe itself.
          for _ in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' sp-smoke 2>/dev/null || echo starting)
            if [ "$status" = healthy ]; then
              break
            fi
            if [ "$status" = unhealthy ]; then
              echo "container went unhealthy:"
              docker logs sp-smoke
              exit 1
            fi
            sleep 2
          done

          if [ "$(docker inspect -f '{{.State.Health.Status}}' sp-smoke)" != healthy ]; then
            echo "container never became healthy:"
            docker logs sp-smoke
            exit 1
          fi
          echo "HEALTHCHECK reports healthy"

      - name: 'Probe: healthz, SPA shell, static assets, auth enforcement'
        run: |
          set -euo pipefail

          BASE=http://127.0.0.1:4173

          # Assert the *body*, not just the status line: an unrouted path
          # falls through to the ServeDir SPA fallback and answers
          # `200 text/html`, so a status-only assertion passes on a route
          # that does not exist. This is the defect the container
          # HEALTHCHECK shipped with.
          health=$(curl -fsS "$BASE/healthz")
          grep -q '"status":"ok"' <<<"$health"

          # The SPA shell, and a real hashed asset behind it. Capturing into a
          # variable instead of piping into `grep -q` avoids the pipefail +
          # SIGPIPE trap on short responses.
          shell=$(curl -fsS "$BASE/")
          grep -q 'id="root"' <<<"$shell"
          asset=$(grep -o '/assets/[A-Za-z0-9._-]*\.js' <<<"$shell" | head -n1)
          if [ -z "$asset" ]; then
            echo "no hashed asset found in the SPA shell — is dist/ laid out right?"
            exit 1
          fi
          curl -fsS "$BASE$asset" -o /dev/null

          # With a password configured, /api/* must reject an unauthenticated
          # caller. This is the guard on the "omit the password and you just
          # published the API" foot-gun the compose file warns about.
          code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/api/projects")
          if [ "$code" != 401 ]; then
            echo "expected 401 without a bearer token, got $code"
            exit 1
          fi

      - name: 'Create a project through the REST API'
        run: |
          set -euo pipefail

          BASE=http://127.0.0.1:4173
          created=$(curl -fsS -X POST "$BASE/api/projects" \
            -H 'Authorization: Bearer ci-secret-token' \
            -H 'Content-Type: application/json' \
            -d '{"name":"ci-smoke-project"}')

          id=$(printf '%s' "$created" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          if [ -z "$id" ]; then
            echo "project create returned no id: $created"
            exit 1
          fi
          echo "created project $id"

      - name: 'Runtime is non-root and carries no GUI stack'
        run: |
          set -euo pipefail

          uid=$(docker exec sp-smoke id -u)
          if [ "$uid" != 10001 ]; then
            echo "expected to run as uid 10001, got $uid"
            exit 1
          fi

          # The property that makes this image ~60 MB instead of ~400 MB:
          # simple-post-server is Tauri-free, so GTK/WebKit must be absent.
          gui=$(docker exec sp-smoke sh -c 'ls /usr/lib/*/libgtk* /usr/lib/*/libwebkit* 2>/dev/null | wc -l')
          if [ "$gui" -ne 0 ]; then
            echo "GUI libraries found in the runtime stage — the Tauri split has been undone:"
            docker exec sp-smoke sh -c 'ls /usr/lib/*/libgtk* /usr/lib/*/libwebkit*'
            exit 1
          fi
          echo "runs as uid 10001, no libgtk/libwebkit present"

      - name: 'Recreate the container against the same volume'
        run: |
          set -euo pipefail

          # `docker restart` would only prove the process comes back. Removing
          # the container outright and starting a *new* one against the same
          # named volume is what actually proves the volume wiring.
          docker rm -f sp-smoke
          docker run -d --name sp-smoke \
            -p 4173:4173 \
            -e SIMPLE_POST_WEB_PASSWORD=ci-secret-token \
            -v sp-smoke-data:/data \
            simple-post:local

          for _ in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' sp-smoke 2>/dev/null || echo starting)
            if [ "$status" = healthy ]; then
              break
            fi
            if [ "$status" = unhealthy ]; then
              echo "replacement container went unhealthy:"
              docker logs sp-smoke
              exit 1
            fi
            sleep 2
          done
          if [ "$(docker inspect -f '{{.State.Health.Status}}' sp-smoke)" != healthy ]; then
            echo "replacement container never became healthy:"
            docker logs sp-smoke
            exit 1
          fi

      - name: 'Assert the project survived the container replacement'
        run: |
          set -euo pipefail

          list=$(curl -fsS http://127.0.0.1:4173/api/projects \
            -H 'Authorization: Bearer ci-secret-token')
          grep -q 'ci-smoke-project' <<<"$list"
          echo "SQLite store survived in the named volume"

      - name: 'Cleanup'
        if: always()
        run: |
          docker rm -f sp-smoke >/dev/null 2>&1 || true
          docker volume rm -f sp-smoke-data >/dev/null 2>&1 || true

  docker-arm64:
    # Compile check only, split out of `docker`. It was `continue-on-error`
    # inside that job already, so it never gated anything — but it consumed
    # most of the wall clock, because `[profile.release]` is `lto = true`
    # with `codegen-units = 1`, which is exactly the configuration QEMU
    # emulation handles worst. A check that does not gate should not run on
    # every PR; main pushes and the weekly schedule are where it earns its
    # keep.
    #
    # `continue-on-error` stays at job level so this stays non-gating even
    # now that it is a job of its own — a target-specific break must never
    # block the amd64 smoke test.
    name: Docker — linux/arm64 compile check (advisory)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: 'Set up QEMU (linux/arm64 cross-build)'
        uses: docker/setup-qemu-action@v4

      - name: 'Set up Buildx'
        uses: docker/setup-buildx-action@v4

      - name: 'Build image (linux/arm64 under QEMU — compile check only)'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          tags: simple-post:arm64-ci
          # `load: true` is impossible here (the runner daemon is amd64), so
          # emit an OCI tarball instead and throw it away.
          outputs: type=oci,dest=/tmp/simple-post-arm64.oci.tar
