name: Publish Container Image

# The repo ships a Dockerfile, a compose file and a swarm file, but until now
# nothing built the image for anyone else — the docs told users to run
# `docker build` + `docker push` against a registry they had to provision.
# This closes that: one `v*` tag produces both the desktop installers and a
# multi-arch image.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (leave empty to use ref name)'
        required: false
        default: ''

concurrency:
  group: publish-image-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push linux/amd64 + linux/arm64
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      # arm64 is cross-built rather than built on a native runner: the
      # project has no arm64 CI runner budget, and this path is a release,
      # not a gate — `lto = true` with `codegen-units = 1` is slow under
      # QEMU, which is why the timeout is generous.
      - name: 'Set up QEMU (linux/arm64 cross-build)'
        uses: docker/setup-qemu-action@v4

      - name: 'Set up Buildx'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Compute image tags'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            # `{{version}}` 把 git tag 的 `v` 去掉（`v0.1.2` → `0.1.2`），而
            # release.yml 的说明里写的是 `:${{ github.ref_name }}`，那带 `v`。
            # 两种拼法都推一份，说明里的命令才是真的能拉下来的那一条。
            type=raw,value=${{ github.ref_name }}

      - name: 'Build and push'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Left off deliberately. The default adds a provenance attestation
          # as an extra manifest entry, which `id-token: write` is needed to
          # sign — and older Swarm pulls treat that manifest as the image.
          # This image is deployed with `docker stack deploy` against a
          # plain `image:` reference, so the plain tag is the one that has to
          # work.
          provenance: false

      - name: 'Verify both architectures resolve from the published tag'
        run: |
          set -euo pipefail
          tag=$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -n1)
          echo "published: $tag"
          docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}'
