name: Publish Container Image

# The repo ships a Dockerfile, a compose file and a swarm file, but until now
# nothing built the image for anyone else — the docs told users to run
# `docker build` + `docker push` against a registry they had to provision.
# This closes that: one `v*` tag produces both the desktop installers and a
# container image for `linux/amd64`.
#
# 镜像标签由 git tag 决定，本工作流不提供手动输入的标签参数。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: publish-image-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push linux/amd64
    # 只有 `v*` tag 触发发布。手动 dispatch 选了分支时 `github.ref_name` 是分支名，
    # 那次构建是还没发布的代码，故它不许占用 `latest`。
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: 'Set up Buildx'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Compute image tags'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # 预发布版（`v0.2.0-rc1`）不许占用 `latest`：它不是给普通用户装的那一份。
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            # `{{version}}` 把 git tag 的 `v` 去掉（`v0.1.2` → `0.1.2`），而
            # release.yml 的说明里写的是 `:${{ github.ref_name }}`，那带 `v`。
            # 两种拼法都推一份，说明里的命令才是真的能拉下来的那一条。
            type=raw,value=${{ github.ref_name }}

      - name: 'Build and push'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Left off deliberately. The default adds a provenance attestation
          # as an extra manifest entry, which `id-token: write` is needed to
          # sign — and older Swarm pulls treat that manifest as the image.
          # This image is deployed with `docker stack deploy` against a
          # plain `image:` reference, so the plain tag is the one that has to
          # work.
          provenance: false

      - name: 'Verify the published tag resolves to linux/amd64 only'
        run: |
          set -euo pipefail
          tag=$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -n1)
          echo "published: $tag"

          # The push either lands a bare image manifest (one platform, no
          # attestation) or an index wrapping it. Read both shapes: an index
          # names its platforms inline, a bare manifest carries them in the
          # image config.
          manifest=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}')
          if jq -e 'has("manifests")' >/dev/null <<<"$manifest"; then
            platforms=$(jq -r '[.manifests[].platform | "\(.os)/\(.architecture)"] | unique | join(",")' <<<"$manifest")
            count=$(jq -r '.manifests | length' <<<"$manifest")
          else
            platforms=$(docker buildx imagetools inspect "$tag" --format '{{json .Image}}' | jq -r '"\(.os)/\(.architecture)"')
            count=1
          fi
          echo "manifests: $count, platforms: $platforms"
          if [ "$count" != "1" ] || [ "$platforms" != "linux/amd64" ]; then
            echo "::error::$tag resolves to $count manifest(s) with platforms [$platforms]; expected exactly one linux/amd64"
            exit 1
          fi
          echo "OK: the tag serves linux/amd64 and nothing else"
