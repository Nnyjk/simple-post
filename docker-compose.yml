# docker-compose.yml — reference deployment for the web shape.
#
# Usage:
#   1. Copy `.env.example` to `.env` and set SP_WEB_PASSWORD (and
#      optionally SP_PUBLIC_BASE_PATH if running behind a reverse proxy).
#   2. Pull or build the image:
#        docker compose pull        # from GHCR
#        docker compose build       # from local Dockerfile.web
#   3. Start:
#        docker compose up -d
#   4. Tail logs:
#        docker compose logs -f simple-post
#
# The compose file deliberately uses environment interpolation with
# `${VAR:?}` so docker compose refuses to start when a required
# variable is missing — better than booting an open auth-free server.

services:
  simple-post:
    # Default tag tracks the web shape. Pin to a specific tag in prod:
    # `image: ghcr.io/nnyjk/simple-post:v0.2.0`
    image: ghcr.io/nnyjk/simple-post:web
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: simple-post-web
    restart: unless-stopped

    ports:
      # Bind 4173 on the host (matches the CLI default). If you
      # already have something on 4173, change the host side.
      - "${SP_WEB_BIND:-4173}:4173"

    volumes:
      # Persistent SQLite store. Survives `docker compose down` (the
      # volume isn't removed unless you pass `--volumes`). To migrate
      # to another host: `docker cp simple-post-web:/data ./data`.
      - simple-post-data:/data

    environment:
      # Auth: REQUIRED. Without it the route tree is open (commit 5's
      # auth_middleware is a no-op when SIMPLE_POST_WEB_PASSWORD is
      # unset). Docker compose refuses to start when this is empty.
      SIMPLE_POST_WEB_PASSWORD: "${SP_WEB_PASSWORD:?set SP_WEB_PASSWORD in .env}"

      # Optional: bind to 0.0.0.0 inside the container (default; the
      # Dockerfile already sets this, but we re-declare for clarity).
      SIMPLE_POST_WEB_BIND: "0.0.0.0:4173"

      # Optional: when serving behind nginx at https://host/sp/, set
      # this to "/sp" so the router nests everything under that prefix
      # (commit 5). Leave empty for the default bare-host deployment.
      SIMPLE_POST_PUBLIC_BASE_PATH: "${SP_PUBLIC_BASE_PATH:-}"

      # SQLite lives in /data inside the container; SIMPLE_POST_DATA_DIR
      # is already baked into the Dockerfile, but we re-declare it
      # here in case the bind mount replaces /data.
      SIMPLE_POST_DATA_DIR: /data

      # Data is persistent — let's not pollute the host. RUST_LOG is
      # unfiltered by default; tighten it for production.
      RUST_LOG: "${SP_RUST_LOG:-info,simple_post=info,tower_http=info}"

    healthcheck:
      # The Dockerfile already has a HEALTHCHECK directive, but
      # declaring it here lets `docker compose ps` show health
      # status without re-deriving from the image.
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # Tini is the container's PID 1 (set by the Dockerfile's
    # ENTRYPOINT), so SIGTERM from `docker compose down` reaches the
    # binary cleanly and SQLite can flush + release the WAL file.
    init: false  # already handled by tini in the image

volumes:
  simple-post-data:
    name: simple-post-data