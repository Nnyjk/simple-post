[package]
name = "simple-post"
version = "0.1.0"
description = "Modern desktop API tool with built-in MCP"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "simple_post_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# RustTLS avoids native-tls/OpenSSL dependency on Windows; brotli/deflate match
# what the browser fetch path supports.
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "gzip",
  "brotli",
  "deflate",
  "http2",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
