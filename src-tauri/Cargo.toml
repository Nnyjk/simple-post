[package]
name = "simple-post"
version = "0.1.0"
description = "Modern desktop API tool with built-in MCP"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "simple_post_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "simple-post-mcp-proxy"
path = "src/bin/mcp_proxy.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# RustTLS avoids native-tls/OpenSSL dependency on Windows; brotli/deflate match
# what the browser fetch path supports.
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "gzip",
  "brotli",
  "deflate",
  "http2",
] }

# MCP tool / HTTP daemon 落地用 (added in v0.1 MCP rollout)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "net", "signal"] }
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
clap = { version = "4", features = ["derive"] }
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
serde_json_path = "0.1"
axum = "0.7"
# Static-file serving for the `serve-web` shape. `ServeDir` powers
# `GET /` and `GET /assets/*` so the SPA can be hosted by the same
# axum process that fronts `/api/*` and `/mcp`.
tower-http = { version = "0.5", features = ["fs", "trace"] }
mime_guess = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
