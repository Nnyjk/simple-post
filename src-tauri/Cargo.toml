[package]
name = "simple-post"
version.workspace = true
description = "Modern desktop API tool with built-in MCP"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Two binaries coexist in this crate: the main Tauri app
# (`src/main.rs`, name derived from `name = "simple-post"`) and the
# stdio bridge for MCP clients (`src/main.rs::run_mcp`). The MCP-only
# CLI now lives in the `simple-post-mcp` workspace member (commit 3),
# which removed the previous `simple-post-mcp-proxy` binary that was
# built from `src/bin/mcp_proxy.rs`. Tauri CLI's `tauri dev` /
# `tauri build` shells out to plain `cargo run` / `cargo build` and
# doesn't pass `--bin`, so we pick the main app by default.
default-run = "simple-post"

[lib]
name = "simple_post_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Workspace members
simple-post-core = { path = "../crates/simple-post-core" }
simple-post-mcp = { path = "../crates/simple-post-mcp" }

# Tauri shell
tauri = { version = "2", features = [] }

# Shared workspace deps (resolved to the versions pinned at the root)
serde = { workspace = true }
serde_json = { workspace = true }
serde_json_path = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
r2d2 = { workspace = true }
r2d2_sqlite = { workspace = true }
clap = { workspace = true }
dirs = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }

# HTTP server (`serve-web` shape). `ServeDir` serves the SPA while
# the same axum process fronts `/api/*` and `/mcp`.
axum = { workspace = true }
tower-http = { workspace = true }
mime_guess = { workspace = true }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
