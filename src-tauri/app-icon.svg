<?xml version="1.0" encoding="UTF-8"?>
<!--
  Canonical Simple Post app icon — the source every platform icon is
  generated from (`npm run icons`, i.e. `tauri icon src-tauri/app-icon.svg`).

  This is the title-bar mark, at icon scale: the same rounded gradient
  tile and the same lucide "Sparkles" glyph `TopBar` renders. The
  colours are the light-theme design tokens in `src/styles/globals.css`
  (primary = hsl(217 91% 60%) = #3C83F6, hue-project =
  hsl(265 58% 44%) = #652FB1), and the corner radius is the title bar's
  `rounded-md` (6px) on its `h-6 w-6` tile — 0.25 of the box, so 256 here.

  Note for editors: XML comments may not contain a double hyphen, which
  is why the CSS custom-property names above are written without their
  leading dashes. `tauri icon` parses this file with a strict XML parser
  and fails the whole build on an ill-formed comment.

  Keep this geometry in sync with `AppIcon`
  (`src/components/ui/app-icon.tsx`), which renders the same shapes
  inline so the window title and the desktop icon cannot drift.

  Regenerate with `npm run icons`. Note that `icon.icns` is NOT
  byte-reproducible: `tauri icon` stamps it, so it shows a diff on every
  run even when the artwork is unchanged. Every other output is
  deterministic — ignore that one file when reviewing a regeneration.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Tailwind's `bg-gradient-to-br` is `to bottom right`. -->
    <linearGradient id="sp-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3C83F6" />
      <stop offset="100%" stop-color="#652FB1" />
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="256" fill="url(#sp-gradient)" />

  <!--
    The glyph sits at 14/24 = 0.583 of the tile — the title bar's
    `h-3.5 w-3.5` Sparkles inside its `h-6 w-6` box — so it scales to
    597.33 units with 213.33 of padding on each side.
  -->
  <g
    transform="translate(213.33 213.33) scale(24.889)"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <!-- lucide `sparkles`, verbatim from lucide-react 0.460 (ISC). -->
    <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z" />
    <path d="M20 3v4" />
    <path d="M22 5h-4" />
    <path d="M4 17v2" />
    <path d="M5 18H3" />
  </g>
</svg>
