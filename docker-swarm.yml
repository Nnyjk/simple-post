# =============================================================================
# simple-post — Docker Swarm stack
#
#     # 1. choose ONE node to own the data, label it, create the volume there
#     docker node update --label-add simple_post_data=true <node-id>
#     docker volume create --driver local simple-post-data
#
#     # 2. build and push under a registry-qualified name
#     docker build -t <registry>/simple-post:0.1.1 .
#     docker push   <registry>/simple-post:0.1.1
#
#     # 3. deploy, naming the image the workers will pull
#     SP_IMAGE=<registry>/simple-post:0.1.1 \
#       docker stack deploy -c docker-swarm.yml simple-post
#
#     docker stack services simple-post
#
# Step 1 is not optional and not bookkeeping. The store is a single SQLite
# file in a node-local volume, and the placement constraint below is what
# keeps the task on the node that has it. Skip the label and the deploy
# fails loudly ("no suitable node"); remove the constraint and it does not
# fail at all — it schedules onto some other node, Docker creates an empty
# volume there, and the service comes up on a blank database with no
# indication that your projects are gone.
#
# `docker stack deploy` only honours a subset of the Compose spec, so this
# file deliberately avoids: `build:` (silently ignored — swarm pulls the
# image instead), top-level `version:` (rejected), `container_name`
# (rejected: swarm tasks are named by the scheduler), and every
# `deploy`-section key that has no Swarm implementation.
# =============================================================================

services:
  simple-post:
    # No `build:` — Swarm resolves this name through a registry, and every
    # node pulls the name written *here*. A bare local tag such as
    # `simple-post:local` exists on exactly one machine, so on a multi-node
    # cluster the workers either fail to pull it or silently use a stale
    # local copy. Defaulting to the local tag keeps the single-node flow
    # working out of the box; `SP_IMAGE` is how you point the stack at the
    # registry-qualified tag you actually pushed (step 2/3 above).
    image: '${SP_IMAGE:-simple-post:local}'

    environment:
      SIMPLE_POST_DATA_DIR: /data

      # See docker-compose.yml for the full warning: an empty password leaves
      # `/api/*` and `/mcp` unauthenticated on a `0.0.0.0` listener.
      SIMPLE_POST_WEB_PASSWORD: ${SP_WEB_PASSWORD:-}
      RUST_LOG: ${SP_RUST_LOG:-info}

      # SIMPLE_POST_PUBLIC_BASE_PATH: ${SP_PUBLIC_BASE_PATH}
      # SIMPLE_POST_BLOCK_PRIVATE_NET: 1

    ports:
      # Published on every node in the cluster, not just the one running the
      # task. `- ${SP_WEB_BIND:-4173}:4173`
      #
      # The MCP endpoint lives on this same port by default (path /mcp).
      - '${SP_WEB_BIND:-4173}:4173'

      # OPTIONAL: a dedicated port for MCP only. The container-side port must
      # equal the port configured in the app (Settings → 连接 → HTTP 服务配置
      # → 端口) — that field is the single source of truth for it. A non-zero
      # value there makes the server open a second listener that serves
      # nothing but MCP (no REST, no SPA).
      #
      # The two published ports must map to **different** container ports on
      # purpose: one container port carries at most one published port (the
      # engine drops the second mapping silently), so the MCP listener needs
      # a port of its own inside the container. Publishing `4174:4173` instead
      # would leave 4174 unbound and the service would look half-deployed.
      #
      # `mode: host` also changes how the update has to be ordered: the
      # published port belongs to the task, so with `start-first` below the
      # old task still owns the host port while the new one starts, and the
      # new container comes up without that mapping. **Switch
      # `update_config.order` to `stop-first` when you uncomment this.**
      #
      # - target: 4174
      #   published: 4174
      #   protocol: tcp
      #   mode: host

    volumes:
      # `driver: local` + `docker volume create` on one specific node — the
      # volume is **node-local**, so it does not follow the task to another
      # node.
      #
      # Note that this is a *different* problem from `replicas: 1`, and
      # `replicas: 1` does not solve it. Replicas is about two writers
      # touching one file at once; this is about the task landing on a node
      # that has never heard of the volume, where Docker creates an empty
      # one and the service starts on a blank database. Only the placement
      # constraint below closes the second hole — see it for the
      # consequence of removing it.
      #
      # If you need real multi-node availability, move the store off SQLite
      # or put the volume on genuinely shared/replicated storage, and
      # re-evaluate the WAL assumption on both counts.
      - simple-post-data:/data

    healthcheck:
      test: ['CMD', '/usr/local/bin/simple-post-healthcheck']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    deploy:
      # -------------------------------------------------------------------------
      # replicas: 1 — do not raise this.
      #
      # The store is a single SQLite file in WAL mode. WAL relies on shared-
      # memory index files (`-shm` / `-wal`) that only work when every reader
      # and writer sees the same filesystem, so WAL on a network volume is
      # already unsafe. Running two writers on the same file makes it worse:
      # they interleave transactions, `with_tx` retries three times and then
      # gives up with SQLITE_BUSY, and `mcp.port` (a single-writer OS-atomic
      # file) can only have one owner.
      #
      # If you need availability, the answer is a real replicated database —
      # not a second replica of this container.
      #
      # This constraint set is about *concurrency*. It says nothing about
      # *placement* — see `placement` below for the node-local-volume trap
      # that `replicas: 1` does not cover.
      # -------------------------------------------------------------------------
      replicas: 1

      # `vip` is the default and, with one replica, behaves the same as
      # `dnsrr` here. It matters only if the file is ever reused with more
      # than one replica: vip load-balances across the replicas behind a
      # virtual IP, dnsrr hands out container IPs via DNS. Either way the
      # traffic is plain TCP over the default **overlay** network, so the
      # bearer password above is the only thing standing between a
      # same-cluster task and the whole API.
      endpoint_mode: vip

      update_config:
        # start-first, not stop-first: the new task comes up (and must pass
        # its healthcheck) before the old one is drained. There is a brief
        # window where two tasks accept connections, which for a single-
        # writer SQLite file means two writers — the same constraint the
        # replicas: 1 comment is about. Swap to stop-first if that matters
        # more than zero-downtime updates; the store is WAL, so a clean stop
        # is always safe.
        #
        # **One exception forces stop-first**: a port published with
        # `mode: host` belongs to the task that holds it, so with
        # start-first the old task still owns the host port while the new one
        # starts, and the new container comes up without that mapping. Use
        # stop-first whenever the `ports` list publishes in host mode.
        order: start-first
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 30s
        max_failure_ratio: 0.3

      rollback_config:
        order: stop-first
        parallelism: 1
        delay: 5s
        failure_action: pause
        monitor: 30s
        max_failure_ratio: 0.3

      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

      resources:
        limits:
          # The release profile is `opt-level = "s"`, so the resident set is
          # small; this is a guard against a runaway outbound request batch,
          # not a sizing recommendation.
          memory: 512M

      # -------------------------------------------------------------------------
      # placement — ON BY DEFAULT. Removing this is how you lose your data.
      #
      # The volume above has the `local` driver, so it exists on exactly one
      # node. Without a constraint, a node failure — or an ordinary reschedule
      # after an update — puts the single task on a *different* node, where
      # Docker has no such volume and quietly creates an empty one. The service
      # comes up healthy, the schema seeds, and every project you had is gone,
      # with nothing in the logs to suggest why. `replicas: 1` does not help:
      # that is about two writers at once, not about which node runs.
      #
      # With the constraint, an unlabelled cluster fails the deploy outright
      # ("no suitable node"), which is the outcome worth having.
      #
      # The one-line setup this depends on is in the header above:
      #   docker node update --label-add simple_post_data=true <node-id>
      # -------------------------------------------------------------------------
      placement:
        constraints:
          - node.labels.simple_post_data == 'true'

volumes:
  simple-post-data:
    driver: local
